<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>実力テスト 第1回 - 伝送線路</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans JP', sans-serif;
        }
        .border-green-500 { border-color: #22c55e; }
        .border-red-500 { border-color: #ef4444; }
    </style>
</head>
<body class="bg-gray-100 text-gray-900">

    <div class="container mx-auto p-4 md:p-8 max-w-3xl">
        <h1 class="text-3xl font-bold mb-8 text-center text-gray-800">
            実力テスト 第1回 (20問)
        </h1>

        <!-- スコア表示エリア -->
        <div id="score-container" class="mb-6"></div>

        <main id="quiz-container" class="space-y-6">
            <!-- テスト問題はここにJavaScriptによって挿入されます -->
        </main>

        <div class="mt-8 text-center">
            <button id="submit-btn" class="bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-8 rounded-lg text-lg transition duration-300">
                採点する
            </button>
        </div>

        <div class="mt-12 text-center">
            <a href="index.html" class="text-blue-600 hover:text-blue-800 hover:underline">
                トップページに戻る
            </a>
        </div>
    </div>

    <script>
        // 実力テスト 第1回 データ
        const testQuestions = [
            {
                "questionType": "multiple-choice",
                "questionText": "同軸ケーブルの記号「S-5C-FB」の「S」が示す意味は何か。",
                "options": [
                    { "text": "シールド(Shield)が強化されている。", "isCorrect": false, "rationale": "シールド構造は「FB」などで示されます。" },
                    { "text": "衛星放送(Satellite)受信用である。", "isCorrect": true, "rationale": "先頭の「S」は衛星放送受信用を示します。" },
                    { "text": "信号(Signal)用である。", "isCorrect": false, "rationale": "これは一般的な用途であり、特定の記号では示されません。" },
                    { "text": "単線(Solid)である。", "isCorrect": false, "rationale": "中心導体の構造を示す記号ではありません。" }
                ]
            },
            {
                "questionType": "fill-in",
                "questionText": "特性インピーダンスが異なる伝送線路を接続すると、接続点で入力信号の一部が戻る現象を [　] という。",
                "correctAnswers": ["反射", "はんしゃ"],
                "rationale": "インピーダンスの不整合により「反射」が発生します。"
            },
            {
                "questionType": "multiple-choice",
                "questionText": "同軸ケーブル「5C-2V」の「C」が示すものは何か。",
                "options": [
                    { "text": "外部導体の概略内径", "isCorrect": false, "rationale": "外部導体の概略内径は「5」が示します。" },
                    { "text": "絶縁体の種類", "isCorrect": false, "rationale": "絶縁体の種類は「2」が示します。" },
                    { "text": "特性インピーダンス (75Ω)", "isCorrect": true, "rationale": "「C」は特性インピーダンスが75Ωであることを示します。" },
                    { "text": "外部導体の構造", "isCorrect": false, "rationale": "外部導体の構造は「V」が示します。" }
                ]
            },
            {
                "questionType": "multiple-choice",
                "questionText": "電磁誘導の影響を最も受けにくく、ノイズに強い伝送線路はどれか。",
                "options": [
                    { "text": "光ファイバケーブル", "isCorrect": true, "rationale": "光信号で伝送するため、電磁誘導ノイズの影響を受けません。" },
                    { "text": "UTPケーブル", "isCorrect": false, "rationale": "シールドがないため、電磁誘導ノイズの影響を受けやすいです。" },
                    { "text": "STPケーブル", "isCorrect": false, "rationale": "シールドがあるためUTPよりは強いですが、光ファイバほどではありません。" },
                    { "text": "同軸ケーブル", "isCorrect": false, "rationale": "シールド構造（外部導体）があるためノイズに強いですが、光ファイバほどではありません。" }
                ]
            },
            {
                "questionType": "fill-in",
                "questionText": "同軸ケーブルの記号「5C-F」の「F」は、絶縁体が [　] であることを示します。",
                "correctAnswers": ["発泡ポリエチレン", "はっぽうポリエチレン"],
                "rationale": "「F」は絶縁体が発泡ポリエチレン (Foam) であることを示します。"
            },
            {
                "questionType": "multiple-choice",
                "questionText": "反射波と入射波が干渉して生じる「定在波」において、振幅が最大となる点を何と呼ぶか。",
                "options": [
                    { "text": "節（ふし）", "isCorrect": false, "rationale": "節は振幅がゼロになる点です。" },
                    { "text": "頂（いただき）", "isCorrect": false, "rationale": "一般的な波の山を指すことはありますが、定在波の用語ではありません。" },
                    { "text": "腹（はら）", "isCorrect": true, "rationale": "腹は振幅が最大になる点です。" },
                    { "text": "谷（たに）", "isCorrect": false, "rationale": "一般的な波の谷を指すことはありますが、定在波の用語ではありません。" }
                ]
            },
            {
                "questionType": "multiple-choice",
                "questionText": "同軸ケーブルの記号「5C-2V」の「V」が示すものは何か。",
                "options": [
                    { "text": "絶縁体がビニルである。", "isCorrect": false, "rationale": "絶縁体は「2」（ポリエチレン）で示されます。" },
                    { "text": "外部導体が編組一重である。", "isCorrect": true, "rationale": "「V」は外部導体が編組 (Braid) 一重であることを示します。" },
                    { "text": "非常に(Very)高性能である。", "isCorrect": false, "rationale": "規格上の記号であり、性能を抽象的に示すものではありません。" },
                    { "text": "外部導体が編組二重である。", "isCorrect": false, "rationale": "編組二重は「W」で示されます。" }
                ]
            },
            {
                "questionType": "fill-in",
                "questionText": "シールド処理されていないツイストペアケーブルを、アルファベット3文字で [　] ケーブルという。",
                "correctAnswers": ["UTP", "utp"],
                "rationale": "UTP (Unshielded Twisted Pair) の略です。"
            },
            {
                "questionType": "multiple-choice",
                "questionText": "同軸ケーブル「3C-2V」の最初の数字「3」に関する記述として正しいものはどれか。",
                "options": [
                    { "text": "外部導体の概略内径が約3mmであることを示す。", "isCorrect": true, "rationale": "最初の数字は外部導体の概略内径(mm)を示します。" },
                    { "text": "外部導体の概略外径が約3mmであることを示す。", "isCorrect": false, "rationale": "外径ではなく内径を示します。" },
                    { "text": "外部導体が3重シールドであることを示す。", "isCorrect": false, "rationale": "3重シールド（編組）は「T」で示されます。" },
                    { "text": "特性インピーダンスが30Ωであることを示す。", "isCorrect": false, "rationale": "特性インピーダンスは「C」(75Ω)が示しています。" }
                ]
            },
            {
                "questionType": "multiple-choice",
                "questionText": "同軸ケーブルの特性インピーダンスは、主に何によって決まるか。",
                "options": [
                    { "text": "内部導体の材質と外部導体の材質の組み合わせ", "isCorrect": false, "rationale": "材質（導電率）も影響しますが、主な決定要因は寸法比です。" },
                    { "text": "内部導体の外径と外部導体の内径の比、および絶縁体の誘電率", "isCorrect": true, "rationale": "特性インピーダンスは $Z_0 = (138 / \\sqrt{\\epsilon}) \\times \\log_{10}(D/d)$ で表され、絶縁体の誘電率($\\epsilon$)と直径比(D/d)で決まります。" },
                    { "text": "ケーブルの曲げ半径", "isCorrect": false, "rationale": "曲げ半径は伝送品質に影響しますが、ケーブル固有の特性インピーダンスを決定しません。" },
                    { "text": "ケーブルの使用周波数", "isCorrect": false, "rationale": "特性インピーダンスは周波数によらずほぼ一定とみなされます（減衰量は周波数に依存します）。" }
                ]
            },
            {
                "questionType": "fill-in",
                "questionText": "UTPケーブルにシールドを施し、外部ノイズの影響を受けにくくしたケーブルを [　] ケーブルという。",
                "correctAnswers": ["STP", "stp"],
                "rationale": "STP (Shielded Twisted Pair) の略です。"
            },
            {
                "questionType": "multiple-choice",
                "questionText": "同軸ケーブルの記号で、特性インピーダンスが50Ω（主に通信用）であることを示す記号はどれか。",
                "options": [
                    { "text": "C", "isCorrect": false, "rationale": "「C」は75Ω（主にテレビ用）を示します。" },
                    { "text": "D", "isCorrect": true, "rationale": "「D」は50Ω（主に通信用）を示します。" },
                    { "text": "F", "isCorrect": false, "rationale": "「F」は絶縁体が発泡ポリエチレンであることを示します。" },
                    { "text": "V", "isCorrect": false, "rationale": "「V」は外部導体が編組一重であることを示します。" }
                ]
            },
            {
                "questionType": "multiple-choice",
                "questionText": "平行線路（平行2線式給電線）に関する記述として正しいものはどれか。",
                "options": [
                    { "text": "外部からの干渉に強く、外部への電磁波の放射も少ない。", "isCorrect": false, "rationale": "構造が開放的なため、干渉に弱く、放射も生じやすいです。" },
                    { "text": "外部からの干渉に弱く、外部への電磁波の放射も生じやすい。", "isCorrect": true, "rationale": "外部空間に開放された状態で伝送するため、外部との干渉が問題となります。" },
                    { "text": "主に光信号の伝送に用いられる。", "isCorrect": false, "rationale": "電気信号の伝送に用いられます。光信号は光ファイバです。" },
                    { "text": "内部導体と外部導体で構成される。", "isCorrect": false, "rationale": "それは同軸ケーブルの構造です。平行線路は2本の導体が平行に配置されます。" }
                ]
            },
            {
                "questionType": "fill-in",
                "questionText": "同軸ケーブルの記号「S-5C-FB」の「FB」は、外部導体がアルミ箔 (Foil) と [　] (Braid) の2重シールドであることを示します。",
                "correctAnswers": ["編組", "へんそ"],
                "rationale": "「F」はアルミ箔、「B」は編組 (Braid) を意味します。"
            },
            {
                "questionType": "multiple-choice",
                "questionText": "同軸ケーブル「5C-2V」の中心導体（心線）の主な役割は何か。",
                "options": [
                    { "text": "外からのノイズを防ぐ。", "isCorrect": false, "rationale": "ノイズを防ぐのは外部導体（シールド）の役割です。" },
                    { "text": "信号を流す。", "isCorrect": true, "rationale": "中心導体は電気信号を伝送する最も重要な部分です。" },
                    { "text": "中心導体と外部導体を絶縁する。", "isCorrect": false, "rationale": "絶縁するのは内部絶縁体の役割です。" },
                    { "text": "ケーブル全体を物理的に保護する。", "isCorrect": false, "rationale": "物理的に保護するのは主に外被の役割です。" }
                ]
            },
            {
                "questionType": "fill-in",
                "questionText": "同軸ケーブルの記号「5C-2V」の「2」は、絶縁体が [　] であることを示します。",
                "correctAnswers": ["ポリエチレン"],
                "rationale": "「2」はポリエチレン、「F」は発泡ポリエチレンを示します。"
            },
            {
                "questionType": "multiple-choice",
                "questionText": "10BASE5や10BASE2といった古いLAN規格で主に使用された伝送線路は何か。",
                "options": [
                    { "text": "同軸ケーブル", "isCorrect": true, "rationale": "10BASE5 (太い同軸)、10BASE2 (細い同軸) で使用されました。" },
                    { "text": "UTPケーブル", "isCorrect": false, "rationale": "10BASE-Tなどで使用されます。" },
                    { "text": "STPケーブル", "isCorrect": false, "rationale": "トークンリングや、ノイズの多い環境でのイーサネットで使用されました。" },
                    { "text": "光ファイバケーブル", "isCorrect": false, "rationale": "10BASE-Fなどで使用されます。" }
                ]
            },
            {
                "questionType": "multiple-choice",
                "questionText": "「S-5C-FV」のシールド構造はどれか。",
                "options": [
                    { "text": "シールドなし", "isCorrect": false, "rationale": "これはUTPケーブルなどです。" },
                    { "text": "1重シールド（編組）", "isCorrect": true, "rationale": "「F」は絶縁体（発泡ポリエチレン）、「V」は外部導体（編組一重）を示します。" },
                    { "text": "2重シールド（アルミ箔＋編組）", "isCorrect": false, "rationale": "2重シールド（アルミ箔＋編組）は「FB」で示されます。" },
                    { "text": "3重シールド", "isCorrect": false, "rationale": "3重シールドは「FBL」などで示されます。" }
                ]
            },
            {
                "questionType": "fill-in",
                "questionText": "定在波において、振幅が常にゼロになる点を [　] と呼び、振幅が最大になる点を [　] と呼ぶ。",
                "correctAnswers": ["節、腹", "節・腹", "せつ、はら"],
                "rationale": "振幅ゼロが「節（ふし/せつ）」、振幅最大が「腹（はら）」です。"
            },
            {
                "questionType": "multiple-choice",
                "questionText": "高周波伝送路に関する記述として、適当で「ない」ものはどれか。",
                "options": [
                    { "text": "光ファイバケーブルは、電磁誘導の影響を受けにくい。", "isCorrect": false, "rationale": "これは正しい記述です。光で伝送するためノイズに強いです。" },
                    { "text": "特性インピーダンスが異なるケーブルを接続すると、その接続点で反射が起こる。", "isCorrect": false, "rationale": "これは正しい記述です。インピーダンスの不整合が原因です。" },
                    { "text": "同軸ケーブル「7C-2V」の「7」は、外部導体の概略内径を示す。", "isCorrect": false, "rationale": "これは正しい記述です。最初の数字は外部導体の概略内径(mm)です。" },
                    { "text": "同軸ケーブルの特性インピーダンスは、内部導体の外径と外部導体の「外径」の比で決まる。", "isCorrect": true, "rationale": "これは誤りです。内部導体の外径(d)と外部導体の「内径」(D)の比で決まります。" }
                ]
            }
        ];

        /**
         * 簡易LaTeXレンダリング関数
         * @param {string} text - 変換するテキスト
         * @returns {string} - 変換後のHTML文字列
         */
        function renderLatex(text) {
            if (typeof text !== 'string') return '';
            // 内部の$...$を先に処理
            let processedText = text.replace(/\$(.*?)\$/g, (match, content) => {
                return content
                    .replace(/\\lambda/g, 'λ')
                    .replace(/\\pi/g, 'π')
                    .replace(/\\times/g, '×');
            });
            
            // $...$の外にあるものも念のため処理（ただし、通常は$で囲まれている想定）
            return processedText
                .replace(/\\lambda/g, 'λ')
                .replace(/\\pi/g, 'π')
                .replace(/\\times/g, '×')
                .replace(/\$/g, ''); // 最終的に残った$も除去
        }

        /**
         * テストページを初期化する関数
         */
        function initTest() {
            const container = document.getElementById('quiz-container');
            if (!container) return;

            testQuestions.forEach((q, index) => {
                const questionIndex = index + 1;
                
                const questionCard = document.createElement('div');
                questionCard.id = `question-card-${index}`;
                questionCard.className = 'bg-white p-6 rounded-lg shadow-md mb-4 border-2 border-transparent transition-colors duration-300';

                // 質問文
                const questionText = document.createElement('p');
                questionText.className = 'text-lg font-semibold mb-4';
                questionText.innerHTML = `<strong>問${questionIndex}:</strong> ${renderLatex(q.questionText)}`;
                questionCard.appendChild(questionText);

                // 解答欄 (4択または記入式)
                const answerArea = document.createElement('div');
                answerArea.className = 'space-y-3';

                if (q.questionType === 'multiple-choice') {
                    q.options.forEach((opt) => {
                        const optionLabel = document.createElement('label');
                        optionLabel.className = 'block p-3 rounded-lg border border-gray-300 cursor-pointer hover:bg-gray-50';
                        
                        const radio = document.createElement('input');
                        radio.type = 'radio';
                        radio.name = `question-${index}`;
                        radio.value = renderLatex(opt.text);
                        radio.className = 'mr-3';
                        
                        optionLabel.appendChild(radio);
                        optionLabel.appendChild(document.createTextNode(renderLatex(opt.text)));
                        answerArea.appendChild(optionLabel);
                    });
                } else if (q.questionType === 'fill-in') {
                    const input = document.createElement('input');
                    input.type = 'text';
                    input.id = `question-input-${index}`;
                    input.className = 'w-full p-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500';
                    input.placeholder = '解答を入力してください';
                    answerArea.appendChild(input);
                }
                questionCard.appendChild(answerArea);

                // 解答表示エリア (最初は非表示)
                const resultDiv = document.createElement('div');
                resultDiv.id = `result-div-${index}`;
                resultDiv.className = 'hidden mt-4 p-3 bg-gray-50 rounded-lg border border-gray-200 text-sm';
                questionCard.appendChild(resultDiv);

                container.appendChild(questionCard);
            });
        }

        /**
         * 採点処理を行う関数
         */
        function gradeTest() {
            let score = 0;
            
            testQuestions.forEach((q, index) => {
                const card = document.getElementById(`question-card-${index}`);
                const resultDiv = document.getElementById(`result-div-${index}`);
                let isCorrect = false;

                // スタイルと結果をリセット
                card.classList.remove('border-green-500', 'border-red-500');
                resultDiv.innerHTML = '';

                if (q.questionType === 'multiple-choice') {
                    const selectedRadio = document.querySelector(`input[name="question-${index}"]:checked`);
                    const correctAnswerText = renderLatex(q.options.find(opt => opt.isCorrect).text);
                    
                    if (selectedRadio && selectedRadio.value === correctAnswerText) {
                        isCorrect = true;
                    }
                    resultDiv.innerHTML = `<strong class="font-bold">正解:</strong> ${correctAnswerText}`;

                } else if (q.questionType === 'fill-in') {
                    const userInput = document.getElementById(`question-input-${index}`).value.trim();
                    const correctKeywords = q.correctAnswers.map(renderLatex);
                    
                    if (userInput) {
                        // ユーザーの入力が、正解キーワードのいずれかを含んでいれば正解
                        isCorrect = correctKeywords.some(keyword => userInput.includes(keyword));
                    }
                    resultDiv.innerHTML = `<strong class="font-bold">正解キーワード:</strong> ${correctKeywords.join(', ')}`;
                }

                // スコア加算とスタイル適用
                if (isCorrect) {
                    score++;
                    card.classList.add('border-green-500');
                } else {
                    card.classList.add('border-red-500');
                }
                resultDiv.classList.remove('hidden');
            });

            // 合計スコアを表示
            const scoreContainer = document.getElementById('score-container');
            scoreContainer.innerHTML = `
                <div class="bg-white p-6 rounded-lg shadow-md text-center">
                    <h2 class="text-2xl font-bold text-gray-800">あなたのスコア: ${score} / ${testQuestions.length} 点</h2>
                </div>
            `;
            // スコア表示位置までスクロール
            scoreContainer.scrollIntoView({ behavior: 'smooth' });
        }

        // DOM読み込み完了時にクイズを初期化
        document.addEventListener('DOMContentLoaded', initTest);

        // 採点ボタンにイベントリスナーを追加
        document.getElementById('submit-btn').addEventListener('click', gradeTest);
    </script>
</body>
</html>
