<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>実力テスト 第2回 (20問)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans JP', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800">

    <header class="bg-white shadow-md sticky top-0 z-10">
        <nav class="container mx-auto p-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-purple-700">実力テスト 第2回 (20問)</h1>
            <a href="index.html" class="text-blue-600 hover:text-blue-800 hover:underline">&laquo; トップページに戻る</a>
        </nav>
    </header>

    <main class="container mx-auto p-6 max-w-3xl">
        
        <!-- スコア表示エリア -->
        <div id="score-container" class="mb-6 p-4 text-2xl font-bold text-center text-gray-800 bg-white rounded-lg shadow-md" style="display: none;">
            <!-- スコアはここに表示されます -->
        </div>

        <!-- ▼▼▼ 欠落していた以下のブロックを復元します ▼▼▼ -->
        <div id="questions-container" class="space-y-6">
            <!-- テスト問題はここに動的に読み込まれます -->
        </div>

        <!-- 採点ボタン -->
        <div class="mt-10 text-center">
            <button id="grade-button" class="bg-purple-600 text-white font-bold text-lg py-3 px-8 rounded-lg shadow-md hover:bg-purple-700 transition-colors duration-300">
                採点する
            </button>
        </div>
        <!-- ▲▲▲ ここまで復元 ▲▲▲ -->

        <div class="mt-10 text-center">
            <a href="index.html" class="text-blue-600 hover:text-blue-800 hover:underline">&laquo; トップページに戻る</a>
            <!-- ▼▼▼ ここに誤って挿入された以下のJSONテキストを全て削除します ▼▼▼ -->
            <!-- { "type": "multiple_choice", ... (中略) ... "keywords": ["実施手順"] } ]; -->
            <!-- ▲▲▲ 削除しました ▲▲▲ -->
        </div>

    </main>

    <script>
        <!-- ▼▼▼ 削除した問題データを、scriptタグ内の正しい位置に挿入します ▼▼▼ -->
        const testQuestions = [
            { "type": "multiple_choice", "question": "情報セキュリティの3要素「CIA」のうち、「I」が示すものは何か。", "options": ["機密性 (Confidentiality)", "完全性 (Integrity)", "可用性 (Availability)", "投資 (Investment)"], "answer": 1 },
            { "type": "fill_in_the_blank", "question": "「秘密を守る」こと、すなわち許可された人だけが情報にアクセスできることを $____$ と言う。", "keywords": ["機密性", "Confidentiality"] },
            { "type": "multiple_choice", "question": "情報セキュリティポリシーの3階層のうち、「What」に相当するものはどれか。", "options": ["基本方針", "対策基準", "実施手順", "監査計画"], "answer": 1 },
            { "type": "fill_in_the_blank", "question": "ソフトウェアの $____$ が提供される前に、その脆弱性を悪用する攻撃をゼロデイ攻撃と呼ぶ。", "keywords": ["修正プログラム", "パッチ", "修正パッチ"] },
            { "type": "multiple_choice", "question": "サービスを利用不能にすることを目的とし、大量のパケットを送りつける攻撃は何か。", "options": ["DoS攻撃", "ゼロデイ攻撃", "セッションハイジャック", "OSコマンドインジェクション"], "answer": 0 },
            { "type": "multiple_choice", "question": "情報セキュリティの3要素のうち、「情報が正しく、安全に保たれている」ことを示すのはどれか。", "options": ["機密性", "完全性", "可用性", "安全性"], "answer": 1 },
            { "type": "fill_in_the_blank", "question": "情報セキュリティポリシーの最上位であり、経営層の意思を示すものを $____$ と呼ぶ。", "keywords": ["基本方針", "ポリシー"] },
            { "type": "multiple_choice", "question": "Webサイトを通じてサーバーの機能を不正に操作する「OSコマンドインジェクション」は、何の脆弱性を利用した攻撃か。", "options": ["ネットワーク機器", "OS本体", "Webアプリケーション", "セッション管理"], "answer": 2 },
            { "type": "fill_in_the_blank", "question": "情報セキュリティの3要素「CIA」の「A」は $____$ を意味する。", "keywords": ["可用性", "Availability"] },
            { "type": "multiple_choice", "question": "情報セキュリティポリシーの「実施手順」の別名として正しいものはどれか。", "options": ["ポリシー", "スタンダード", "プロシージャー", "マニフェスト"], "answer": 2 },
            { "type": "multiple_choice", "question": "他人のセッションIDを推測したり窃取したりして、なりすましの通信を行う攻撃は何か。", "options": ["DoS攻撃", "セッションハイジャック", "ゼロデイ攻撃", "OSコマンドインジェクション"], "answer": 1 },
            { "type": "fill_in_the_blank", "question": "「必要な時に、必要な情報にアクセスできる」ことを保証する性質を $____$ と言う。", "keywords": ["可用性", "Availability"] },
            { "type": "multiple_choice", "question": "情報セキュリティポリシーの「基本方針」は、一般的にどのように策定されるのが望ましいか。", "options": ["技術者ごとに個別に策定する。", "部門や業務分掌に合わせて複数策定する。", "組織全体として1つにまとめる。", "毎月見直しを行い、頻繁に改定する。"], "answer": 2 },
            { "type": "fill_in_the_blank", "question": "DoS攻撃のうち、複数のコンピュータを踏み台として利用するものを $____$ 攻撃と呼ぶ。", "keywords": ["DDoS", "分散DoS"] },
            { "type": "multiple_choice", "question": "ゼロデイ攻撃が危険とされる主な理由はどれか。", "options": ["攻撃の検出が非常に容易であるため。", "攻撃対象が限定的であるため。", "修正プログラムが存在しない段階での攻撃であるため。", "攻撃者が特定しやすい攻撃であるため。"], "answer": 2 },
            { "type": "fill_in_the_blank", "question": "情報セキュリティポリシーの3階層のうち、「スタンダード」とも呼ばれるのは $____$ である。", "keywords": ["対策基準"] },
            { "type": "multiple_choice", "question": "「機密性」を侵害する行為の例として、最も適切なものはどれか。", "options": ["サーバーに過剰な負荷をかけ、サービスを停止させる。", "データベースのデータを不正に書き換える。", "許可なく他人の個人情報を閲覧する。", "必要な時にシステムにログインできないようにする。"], "answer": 2 },
            { "type": "fill_in_the_blank", "question": "Webアプリケーションが、ユーザーからの入力値を適切に $____$ しない（無害化しない）場合、OSコマンドインジェクションの危険性がある。", "keywords": ["サニタイズ", "検証", "エスケープ処理"] },
            { "type": "multiple_choice", "question": "「可用性」を侵害する行為の例として、最も適切なものはどれか。", "options": ["DoS攻撃によってWebサイトを閲覧不能にする。", "ネットワークを盗聴してパスワードを盗む。", "顧客リストのデータを不正にコピーする。", "テストの点数を勝手に変更する。"], "answer": 0 },
            { "type": "fill_in_the_blank", "question": "情報セキュリティポリシーの3階層のうち、「プロシージャー」と呼ばれるのは $____$ である。", "keywords": ["実施手順"] }
        ];
        <!-- ▲▲▲ 挿入しました ▲▲▲ -->

        /**
         * 簡易的なLaTeX表記をプレーンテキスト/記号に変換する
         */
        function renderLatex(text) {
            if (typeof text !== 'string') return text;
            return text
                .replace(/\$(.*?)\$/g, '$1') // $...$ を除去
                .replace(/\\lambda/g, 'λ')   // \lambda -> λ
                .replace(/\\pi/g, 'π')       // \pi -> π
                .replace(/\\times/g, '×');    // \times -> ×
        }

        /**
         * テスト問題をページに読み込む
         */
        function loadTestQuestions() {
            const container = document.getElementById('questions-container');
            if (!container) return;

            testQuestions.forEach((q, index) => {
                const questionCard = document.createElement('div');
                questionCard.id = `question-card-${index}`;
                questionCard.className = 'bg-white p-6 rounded-lg shadow-md border-2 border-transparent';

                // 問題文
                const questionText = document.createElement('p');
                questionText.className = 'text-lg font-semibold mb-4';
                questionText.innerHTML = `<strong>問 ${index + 1}:</strong> ${renderLatex(q.question)}`;
                questionCard.appendChild(questionText);

                // 解答欄
                if (q.type === 'multiple_choice') {
                    const optionsDiv = document.createElement('div');
                    optionsDiv.className = 'space-y-3 mb-4';
                    q.options.forEach((option, i) => {
                        const label = document.createElement('label');
                        label.className = 'block p-3 rounded-md border border-gray-200 hover:bg-gray-50 cursor-pointer';
                        
                        const radio = document.createElement('input');
                        radio.type = 'radio';
                        radio.name = `q${index}`;
                        radio.value = i;
                        radio.className = 'mr-3';

                        label.appendChild(radio);
                        label.appendChild(document.createTextNode(renderLatex(option)));
                        optionsDiv.appendChild(label);
                    });
                    questionCard.appendChild(optionsDiv);
                } else if (q.type === 'fill_in_the_blank') {
                    const input = document.createElement('input');
                    input.type = 'text';
                    input.id = `q${index}`;
                    input.className = 'w-full p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-transparent';
                    input.placeholder = '解答を入力してください';
                    questionCard.appendChild(input);
                }
                
                // 解答表示エリア（採点後に表示）
                const answerDisplay = document.createElement('div');
                answerDisplay.id = `answer-display-${index}`;
                answerDisplay.className = 'hidden mt-4 p-3 bg-gray-50 border-t border-gray-200';
                questionCard.appendChild(answerDisplay);

                container.appendChild(questionCard);
            });
        }

        /**
         * テストを採点する
         */
        function gradeTest() {
            let score = 0;
            const scoreContainer = document.getElementById('score-container');
            
            testQuestions.forEach((q, index) => {
                const card = document.getElementById(`question-card-${index}`);
                const answerDisplay = document.getElementById(`answer-display-${index}`);
                let isCorrect = false;

                if (q.type === 'multiple_choice') {
                    const selected = document.querySelector(`input[name="q${index}"]:checked`);
                    if (selected && parseInt(selected.value) === q.answer) {
                        isCorrect = true;
                    }
                    answerDisplay.innerHTML = `<span class="font-bold">正解:</span> ${renderLatex(q.options[q.answer])}`;
                } else if (q.type === 'fill_in_the_blank') {
                    const userInput = document.getElementById(`q${index}`).value.trim();
                    const convertedKeywords = q.keywords.map(k => renderLatex(k));
                    
                    for (const keyword of convertedKeywords) {
                        if (userInput.includes(keyword)) {
                            isCorrect = true;
                            break;
                        }
                    }
                    answerDisplay.innerHTML = `<span class="font-bold">正解キーワード:</span> ${convertedKeywords.join(', ')}`;
                }

                // 正解・不正解のスタイル適用
                if (isCorrect) {
                    score++;
                    card.classList.remove('border-transparent', 'border-red-500');
                    card.classList.add('border-green-500');
                } else {
                    card.classList.remove('border-transparent', 'border-green-500');
                    card.classList.add('border-red-500');
                }
                
                answerDisplay.classList.remove('hidden');
            });

            // スコア表示
            scoreContainer.innerHTML = `あなたのスコア: ${score} / ${testQuestions.length} 点`;
            scoreContainer.style.display = 'block';

            // スコア表示エリアまでスクロール
            scoreContainer.scrollIntoView({ behavior: 'smooth' });

            // 採点ボタンを非表示にする
            document.getElementById('grade-button').style.display = 'none';
        }

        // ページ読み込み時に問題をロード
        document.addEventListener('DOMContentLoaded', loadTestQuestions);
        // 採点ボタンにイベントリスナーを設定
        document.getElementById('grade-button').addEventListener('click', gradeTest);

    </script>
</body>
</html>
