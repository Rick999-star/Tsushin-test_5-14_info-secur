        /**
         * 簡易LaTeXレンダリング関数
         * @param {string} text - 変換するテキスト
         * @returns {string} - 変換後のHTML文字列
         */
        function renderLatex(text) {
            if (typeof text !== 'string') return '';
            return text
                .replace(/\$(.*?)\$/g, (match, content) => {
                    return content
                        .replace(/\\lambda/g, 'λ')
                        .replace(/\\pi/g, 'π')
                        .replace(/\\times/g, '×');
                })
                .replace(/\\lambda/g, 'λ')
                .replace(/\\pi/g, 'π')
                .replace(/\\times/g, '×');
        }

        /**
         * 練習問題ページを初期化する関数
         */
        function initPracticeQuiz() {
            const container = document.getElementById('quiz-container');
            if (!container) return;

            // fill-in問題をmultiple-choiceに変換（練習問題ページのみの仕様）
            const questions = practiceQuestions.map(q => {
                if (q.questionType === 'fill-in' && q.options) {
                    q.questionType = 'multiple-choice';
                }
                return q;
            });

            questions.forEach((q, index) => {
                const questionIndex = index + 1;
                
                const questionCard = document.createElement('div');
                questionCard.className = 'bg-white p-6 rounded-lg shadow-md mb-4';

                // 質問文
                const questionText = document.createElement('p');
                questionText.className = 'text-lg font-semibold mb-4';
                questionText.innerHTML = `<strong>問${questionIndex}:</strong> ${renderLatex(q.questionText)}`;
                questionCard.appendChild(questionText);

                // 選択肢
                const optionsContainer = document.createElement('div');
                optionsContainer.className = 'space-y-3';
                q.options.forEach((opt, optIndex) => {
                    const optionHtml = `
                        <label class="block p-3 rounded-lg border border-gray-300 cursor-pointer hover:bg-gray-50">
                            <input type="radio" name="question-${questionIndex}" value="${renderLatex(opt.text)}" class="mr-3" disabled>
                            ${renderLatex(opt.text)}
                        </label>
                    `;
                    optionsContainer.innerHTML += optionHtml;
                });
                questionCard.appendChild(optionsContainer);

                // 解答・解説トグルボタン
                const toggleButton = document.createElement('button');
                toggleButton.id = `toggle-btn-${questionIndex}`;
                toggleButton.className = 'mt-4 bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded transition duration-300';
                toggleButton.textContent = '解答・解説を表示';
                questionCard.appendChild(toggleButton);

                // 解答・解説エリア (最初は非表示)
                const answerDiv = document.createElement('div');
                answerDiv.id = `answer-div-${questionIndex}`;
                answerDiv.className = 'hidden mt-4 p-4 bg-gray-50 rounded-lg border border-gray-200';
                
                const correctAnswer = q.options.find(opt => opt.isCorrect);
                let answerHtml = `<p class="text-lg font-bold text-green-700 mb-3">正解: ${renderLatex(correctAnswer.text)}</p>`;
                
                answerHtml += '<h4 class="font-semibold mb-2">【各選択肢の解説】</h4>';
                answerHtml += '<ul class="list-disc list-inside space-y-1">';
                q.options.forEach(opt => {
                    answerHtml += `<li><strong>${renderLatex(opt.text)}:</strong> ${renderLatex(opt.rationale)}</li>`;
                });
                answerHtml += '</ul>';

                answerDiv.innerHTML = answerHtml;
                questionCard.appendChild(answerDiv);

                // ボタンのクリックイベント
                toggleButton.addEventListener('click', () => {
                    const isHidden = answerDiv.classList.toggle('hidden');
                    toggleButton.textContent = isHidden ? '解答・解説を表示' : '解答・解説を隠す';
                });

                container.appendChild(questionCard);
            });
        }

        // DOM読み込み完了時にクイズを初期化
        document.addEventListener('DOMContentLoaded', initPracticeQuiz);
    </script>
